# sim-vonr-cli sample configuration
local:
  bind_ip: "0.0.0.0"
  bind_port: 5060

pcscf:
  host: "proxy.example.com"
  port: 5060
  transport: "udp"

identity:
  impi: "alice@example.com"
  impu: "sip:alice@example.com"
  realm: "example.com"

auth:
  mode: "aka"
  digest:
    password: "password"
  aka:
    opc: "11111111111111111111111111111111"
    ki: "11111111111111111111111111111111"
    amf: "8000"
    sqn: "000000000000"

sip:
  user_agent: "sim-vonr-cli/0.1.0"
  expires: 3600
  enable_100rel: false
  auto_answer: true

ims_headers:
  enable: false
